<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center text-primary mb-4">Bootstrap Images</h2>
        <div class="row g-4">
            <div class="col-md-3">
                <img src="images/Profile.jpg.jpeg" class="img-fluid rounded-circle" alt="Profile">
            </div>
            <div class="col-md-3">
                <img src="images/workpace.jpg.jpeg" class="img-fluid rounded" alt="Workspace">
            </div>
            <div class="col-md-3">
                <img src="images/Macbook.jpg.jpeg" class="img-fluid img-thumbnail" alt="Mackbook">
            </div>
            <div class="col-md-3">
                <img src="images/Dubai-marina.jpg.jpeg" class="img-fluid rounded" alt="Dubai">
            </div>
        </div>
        <button class="btn btn-primary mt-4" id="btn">Show Message</button>
    </div>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
