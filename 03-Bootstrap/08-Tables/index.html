<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center text-primary mg-4">Employee Details</h2>
        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Country</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>101</td>
                        <td>Prince</td>
                        <td>Frontend</td>
                        <td>India</td>
                    </tr>
                    <tr>
                        <td>102</td>
                        <td>Saif</td>
                        <td>Backend</td>
                        <td>UAE</td>
                    </tr>
                    <tr>
                        <td>103</td>
                        <td>Ahmad</td>
                        <td>Full</td>
                        <td>USA</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <button class="btn btn-success mt-3" id="btn">Show Data</button>
    </div>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
