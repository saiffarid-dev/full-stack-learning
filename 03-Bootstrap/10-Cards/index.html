<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow" style="width: 20rem;">
            <img src="images/workpace.jpg.jpeg" class="card-img-top" alt="Workspace">
            <div class="card-body">
                <h5 class="card-body">Full Stack Developer</h5>
                <p class="card-text">Learn HTML, CSS, JavaScript, Bootstrap and become a professional Full Stack Developer</p>
                <button class="btn btn-primary" id="btn">Read More</button>
            </div>
        </div>
    </div>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
