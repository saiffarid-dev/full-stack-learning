<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div id="slider" class="carousel slide">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="images/city-view.jpg.jpeg" class="d-block w-100" alt="">
                </div>
                <div class="carousel-item">
                    <img src="images/Coding-disk.jpg.jpeg" class="d-block w-100" alt="">
                </div>
                <div class="carousel-item">
                    <img src="images/coding-setup.jpg.jpeg" class="d-block w-100" alt="">
                </div>
            </div>
            <button class="carousel-control-prev" data-bs-target="#slide" data-bs-slider="prev"> <span class="carousel-control-prev-icon"></span> </button>
                <button class="carousel-control-next" data-bs-target="#slider" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
        </div>
    </div>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
