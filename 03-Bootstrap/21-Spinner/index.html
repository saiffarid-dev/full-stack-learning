<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinner</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h3 class="mb-3">Loading Spinners</h3>
        <div class="Spineer-border text-primary"></div>
        <div class="spinner-grow text-success mt-3"></div>
        <div class="spinner-border spinner-border-sm text-danger ms-3"></div>
        <br><br>
        <button class="btn btn-primary" id="btn">Loading... <span class="spinner-border spinner-border-sm ms-2"></span></button>
    </div>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
