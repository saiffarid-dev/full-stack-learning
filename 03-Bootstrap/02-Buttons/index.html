<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" mt-5>
        <h1 class="text-primary mb-4">Bootstrap Buttons</h1>
        <!--- Normal Buttons -->
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-warning">Warning</button>
        <button class="btn btn-info">Info</button>
        <button class="btn btn-light">Light</button>
        <button class="btn btn-dark">Dark</button>
        <hr>
        <!-- Outline Buttons -->
         <button class="btn btn-outline-primary">Outline Primary</button>
        <button class="btn btn outline-success">Outline Success</button>
        <button class="btn btn outline-danger">Outline Danger</button>
        <hr>
        <!--- Button Sizes -->
        <button class="btn btn-primary btn-lg">Large Button</button>
        <button class="btn btn-success">Normal Button</button>
        <button class="btn btn-danger btn-sm">Small Button</button>
        <hr>
        <!-- Full Width Button -->
        <button class="btn btn-dark w-100">Full Width Button</button>
    </div>
    
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
