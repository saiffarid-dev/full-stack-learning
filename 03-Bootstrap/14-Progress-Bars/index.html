<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bars</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h3>Course Progress</h3>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width: 70%">70%</div>
        </div>
        <div class="progress mg-3">
            <div class="progress-bar bg-warning progress-bar-striped" style="width: 50%;">50%</div>
        </div>
        <div class="progress">
            <div class="progress-bar bg-danger progress-bar-striped progress-bar-animated" style="width: 90%;">90%</div>
        </div>
        <button class="btn btn-primary mt-3" id="btn">Show Progress</button>
    </div>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
