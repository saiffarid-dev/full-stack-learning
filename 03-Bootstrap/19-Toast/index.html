<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <button class="btn btn-primary" data-bs-toggle="toast" id="btn">Show Toast
        </button>
        <div class="toast mt-3" id="myToast">
            <div class="toast-header">
                <strong class="me-auto">Notification</strong> <button class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body">Welcome to Bootstrap Toast!</div>
        </div>
    </div>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
