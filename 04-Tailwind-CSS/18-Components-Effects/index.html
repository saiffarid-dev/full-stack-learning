<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Components</title>
    <link rel="stylesheet" href="../output.css" />
  </head>
  <body class="p-6 bg-gray-1000">
    <!-- Button -->
    <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700">
      Click Me
    </button>
    <!-- Card -->
    <div class="bg-white p-5 rounded-lg shadow-lg w-64 mt-6">
      <h2 class="font-bold text-xl">Product Card</h2>
      <p class="text-gray-600">Tailwind CSS Card</p>
    </div>

    <!-- Badge -->
    <span
      class="inline-block bg-green-500 text-white px-2 py-1 rounded-full mt-6"
      >Active</span
    >

    <!-- Filter -->
    <div class="mt-6">
      <div class="w-32 h-32 bg-purple-500 grayscale">Filter</div>
    </div>

    <!-- Backdrop Effect -->
    <div class="mt-6 p-5 bg-white/50 backdrop-blur-md rounded-lg">
      Glass Effect
    </div>
  </body>
</html>
