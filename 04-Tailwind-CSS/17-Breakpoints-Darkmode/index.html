<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breakpoints</title>
    <link rel="stylesheet" href="../output.css" />
  </head>
  <body class="p-6 bg-white dark:bg-gray-900">
    <!-- Breakpoints -->
    <div class="bg-blue-500 text-white p-4 text-sm md:text-xl lg:text-3xl mb-5">
      Responsive Text
    </div>
    <!-- Dark Mode -->
    <div
      class="bg-gray-200 dark:bg-gray-700 text-black dark:text-white p-4 mb-5"
    >
      Dark Mode
    </div>
    <!-- Form -->
    <input
      type="text"
      placeholder="Enter Name"
      class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 mb-5"
    />

    <!-- Arbitrary Value -->
    <div class="w-[300px] bg-[#123456] text-white p-4 mb-5">Custom Value</div>

    <!-- Gradient -->
    <div
      class="bg-gradient-to-r from-white-500 via-purple-500 to pink-500 text-white p-6"
    >
      Gradient
    </div>
  </body>
</html>
