<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover</title>
    <link rel="stylesheet" href="../output.css" />
  </head>
  <body>
    <!-- Hover -->
    <button class="bg-blue-500 text-white px-5 py-2 rounded hover:bg-red-500">
      Hover Me
    </button>
    <!-- Focus -->
    <input
      type="text"
      placeholder="Enter Name"
      class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
    <!-- Active -->
    <button class="bg-green-500 text-white px-5 py-5 rounded active:bg-red-500">
      Click Me
    </button>
    <!-- Transition + Duration -->
    <div
      class="bg-purple-500 text-white px-5 py-2 rounded transition duration-500 hover:bg-pink-500 hover:scale-110"
    >
      Transition
    </div>
  </body>
</html>
