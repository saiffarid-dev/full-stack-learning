<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Decoration</title>
    <link rel="stylesheet" href="../output.css" />
  </head>
  <body>
    <!-- ====== Text Decoration -->
    <!-- Underline  -->
    <h2 class="text-2xl font-bold">UnderLine</h2>
    <p class="underline">Welcome To Tailwind CSS</p>
    <hr />
    <!-- OverLine -->
    <h2 class="text-2xl font-bold">Overline</h2>
    <p class="overline">Welcome to Tailwind CSS</p>
    <hr />
    <!-- Line Throught  -->
    <h2 class="text-2xl font-bold">Line Through</h2>
    <p class="line-throught">Welcome to Tailwind CSS</p>
    <hr />
    <!-- No Underline -->
    <h2 class="text-2xl font-bold">No Underline</h2>
    <a href="" class="underline">Default Underline</a>
    <br /><br />
    <a href="#" class="no-underline" Underline Removed></a>
  </body>
</html>
