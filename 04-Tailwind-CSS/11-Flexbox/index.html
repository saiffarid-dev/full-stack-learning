<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <link rel="stylesheet" href="../output.css" />
  </head>
  <body>
    <!-- Flex Row -->
    <h2 class="text-xlfont-bold mb-3">Flex Row</h2>
    <div class="flex gap-3 mb-6">
      <div class="bg-blue-500 text-white p-4">1</div>
      <div class="bg-blue-500 text-white p-4">2</div>
      <div class="bg-green-500-text-white p-4">3</div>
    </div>
    <!-- Flex Column -->
    <h2 class="text-xl font-bold mb-3">Flex Column</h2>
    <div class="flex flex-col gap-3 mb-6">
      <div class="bg-yellow-500 p-4">A</div>
    </div>
    <div class="bg-pink-500 p-4">B</div>
    <div class="bg-purple-500 text-white p-4">C</div>
    <!-- Justify Content -->
    <h2 class="text-xl font-bold mb-3">Align Items Center</h2>
    <div class="flex items-center h-24 bg-gray-300 mb-6">
      <div class="bg-green-600 text-white p-3">Center</div>
    </div>
  </body>
</html>
